name: Publish notebook
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run docs:build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
  link-readme:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record published URL
        env:
          SITE_URL: ${{ needs.deploy.outputs.url }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('README.md')
          text = path.read_text()
          replacement = f"<!-- pages-link:start -->\n[Open Game Fieldnotes]({os.environ['SITE_URL']})\n<!-- pages-link:end -->"
          path.write_text(re.sub(r'<!-- pages-link:start -->.*?<!-- pages-link:end -->', lambda _: replacement, text, flags=re.S))
          PY
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Link published research notebook"
            git push origin HEAD:main
          fi
